# The gates that run on a push. release-tools.yml also gates the Go tools, but only on a tag, which is
# no gate on the commits between tags.
#
# The Go step duplicates release-tools.yml's `Gate`, and that one must stay: it guards the
# binaries a release attaches, and `resolve.sh` prefers a downloaded binary over the source beside
# it, so a release built from unchecked code is worse than no release. Sharing them would mean a
# reusable workflow, which is more machinery than four commands are worth.
#
# Two jobs, where there were four. The `suites` job ran every `*-test.sh` and there are none left —
# the installers, the MCP scripts and every library they shared are Go, and the three scripts that
# stay shell are covered by Go suites inside the module. The `mutants` job swept a hand-written table
# of 526 deliberate breaks and is deleted: `ai/kk-flavor/standards/testing.md` rule 7 says a negative
# control runs once, by hand, when the case is written, never as standing machinery.
#
# The matrix stays on the Go job for one reason, and it is not portability of the tests: macOS is
# where /bin/bash is 3.2, and `eco-check`'s parse scan asks every bash the machine carries, so the
# macOS leg is the only place that arm of it runs at all. fail-fast is off so one leg going red still
# reports the other.
#
# The actions carry a major tag rather than an exact pin: nothing in this repo bumps an exact pin, so
# it would rot and never pick up a patch like checkout v7.0.1's fork-guard fix. Prune this override
# the day dependabot or renovate lands.
#
# Every setup-go step here sets `cache: false`, for one reason: setup-go looks for its cache key file
# in the repo root only — go.mod now, go.sum before v6.3.0 — and this module is in ai/tools. Left
# default it annotates every run with a miss that can never become a hit. cache-dependency-path would
# point it here, but the only thing to cache is a build cache keyed on a go.mod that never changes.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `-count=1` because this job's whole job is to measure the commit, and a runner's build cache is
  # warm between steps. Nothing here reads outside the module any more, so Go's cache would now be
  # correct — it is defeated because a gate that answers from cache is not a sweep, not because it
  # would answer wrongly.
  #
  # `-timeout 100s`, the same bound `ai/gate.sh` carries and `testing.md` rule 6 states. A suite that
  # hangs then fails as the thing it is, rather than after Go's ten-minute default with a goroutine
  # dump that reads like a deadlock. The two numbers have to move together.
  #
  # `-cover` for the one number `testing.md` asks for, printed per package.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      - name: Gate
        working-directory: ai/tools
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          # -timeout, and this value, for the reason ai/tools/gate/gate.go states at budgetSeconds.
          # The two have to match.
          go test -count=1 -timeout 100s ./...

      # The one number `ai/kk-flavor/standards/testing.md` → **6. Coverage** asks for, and the floor it
      # sets. Its own step rather than a flag on the Gate above, because that step is byte-identical to
      # release-tools.yml's and `workflows_test.go` holds the two to each other — a flag here alone
      # would be the drift that case exists to catch.
      #
      # Linux only: the number is a property of the code, not of the runner, and two legs reporting
      # two numbers invites someone to read the higher one.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        working-directory: ai/tools
        run: |
          go test -count=1 -timeout 100s -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "coverage: $total"
          # awk rather than bash arithmetic: the figure is a percentage with one decimal, and bash has
          # no floats. The comparison is `<`, so exactly 80.0 passes, which is what "≥ 80%" means.
          awk -v got="${total%\%}" 'BEGIN { if (got < 80) { printf "coverage %s%% is under the 80%% floor testing.md sets\n", got > "/dev/stderr"; exit 1 } }'

  # The instruction tree — standards, SKILL.md files, templates. The wiring check is not a Go suite,
  # so without this job a citation pointing at a file that does not exist reaches main with nothing
  # looking at it.
  #
  # `check.sh` exits 1 with findings and 2 when it could not run at all, and both fail the job:
  # a check that did not run is not a clean one, which is the rule the script's own header states.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The scans are Go. `check.sh` reaches the binary through `resolve.sh`, which builds from the
      # source beside it when no release binary is present — which is the case on a fresh runner.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      # --gate, so this job and ai/gate.sh's wiring check ask the same question of the same commit.
      # Not a no-op on a fresh runner: the build the step above provides for writes ai/tools/bin/eco-check
      # before the binary execs, so build output is in the tree by the time the walk runs, and without
      # the flag the check reads files it cannot judge.
      - name: Check the instruction tree wires up
        run: |
          ai/kk-flavor/skills/kk-ecosystem/scripts/check.sh --agent=claude --gate
          ai/kk-flavor/skills/kk-ecosystem/scripts/check.sh --agent=codex --gate
