# The gates that run on a push. release-tools.yml also gates the Go tools, but only on a tag, which is
# no gate on the commits between tags.

# The Go step duplicates release-tools.yml's `Gate`, and that one must stay: it guards the
# binaries a release attaches, and `resolve.sh` prefers a downloaded binary over the source beside
# it, so a release built from unchecked code is worse than no release. Sharing them would mean a
# reusable workflow, which is more machinery than four commands are worth.

# Four jobs, where there were six. The `suites` job ran every `*-test.sh`, and none are left. The
# installers, the MCP scripts and the libraries they shared are all Go, and the three scripts that
# stay shell are covered by Go suites inside the module.

# The `mutants` job swept a hand-written table of 526 deliberate breaks and is deleted.
# `ai/kk-flavor/standards/testing.md` rule 7 asks for a negative control run once by hand when the
# case is written, and keeps it out of standing machinery.

# The matrix stays on the Go job, and portability of the tests is not the reason. macOS is where
# /bin/bash is 3.2, and `eco-check`'s parse scan asks every bash the machine carries. That makes the
# macOS leg the only place that arm of the scan runs. fail-fast is off, so one leg going red still
# reports the other.

# The actions carry a major tag rather than an exact pin: nothing in this repo bumps an exact pin, so
# it would rot and never pick up a patch like checkout v7.0.1's fork-guard fix. Prune this override
# the day dependabot or renovate lands.

# Every setup-go step here sets `cache: false`. The module declares no dependencies, and the only
# thing a hit restores is a build cache. Any decision to turn it on is about CI wall clock, and a
# default is no evidence. Until v6.3.0 setup-go looked for its key file in the repo root only, and
# go.mod now sits there.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `-count=1` because this job measures the commit, and a runner's build cache is warm between
  # steps. The Coverage step runs the same suite, and without the flag it would report a number read
  # out of the Gate step's cache. release-tools.yml's Gate step says the same.

  # `-timeout 300s`, the backstop `ai/gate.sh` hands its own `go test` — `suiteTimeoutSeconds`, and
  # the two numbers have to move together. A suite that hangs then fails in minutes, ahead of Go's
  # ten-minute default, with a goroutine dump that reads like a deadlock.

  # That 300 is NOT the 100 seconds `testing.md` rule 6 states. Rule 6 is a budget over the whole
  # gate, and gate.go's own wall clock is what enforces it. No wall clock runs here, so this leg
  # bounds hangs alone.

  # `-coverprofile` for the coverage number `testing.md` asks for, which the Coverage step reads back
  # as a total.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Gate
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          # -timeout, and this value, for the reason ai/tools/gate/gate.go states at suiteTimeoutSeconds.
          # The two have to match.
          go test -count=1 -timeout 300s ./...

      # The coverage number `ai/kk-flavor/standards/testing.md` asks for, and the floor it sets.
      # This is a step of its own, because the Gate step is byte-identical to release-tools.yml's and
      # `workflows_test.go` holds the two to each other. A flag added here alone is what that case
      # exists to catch.

      # Linux only: the number is a property of the code, not of the runner, and two legs reporting
      # two numbers invites someone to read the higher one.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -count=1 -timeout 300s -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "coverage: $total"
          # awk, because bash has no float arithmetic and the figure is a percentage with one decimal.
          # The comparison is `<`, so exactly 80.0 passes. That is what "≥ 80%" means.
          awk -v got="${total%\%}" 'BEGIN { if (got < 80) { printf "coverage %s%% is under the 80%% floor testing.md sets\n", got > "/dev/stderr"; exit 1 } }'

  # The instruction tree — standards, SKILL.md files, templates. The wiring check is no Go suite, so
  # this job is the only thing that runs it on a push. A citation pointing at a file that is absent
  # would otherwise reach main unread.

  # `check.sh` exits 1 with findings and 2 when it could not run at all, and both fail the job:
  # a check that did not run is not a clean one, which is the rule the script's own header states.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The scans are Go. `check.sh` reaches the binary through `resolve.sh`, which builds from the
      # source beside it when no release binary is present — which is the case on a fresh runner.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # --gate, so this job and ai/gate.sh's wiring check ask the same question of the same commit.
      # Not a no-op on a fresh runner: the build the step above provides for writes ai/tools/bin/eco-check
      # before the binary execs, so build output is in the tree by the time the walk runs, and without
      # the flag the check reads files it cannot judge.
      - name: Check the instruction tree wires up
        run: |
          ai/kk-flavor/skills/kk-ecosystem/scripts/check.sh --agent=claude --gate
          ai/kk-flavor/skills/kk-ecosystem/scripts/check.sh --agent=codex --gate

  # The register of a change set's OWN added comments. The tool that measures the register is written
  # by sessions that also write the comments it judges, and a seventeen-finding diff shipped from this
  # repository before this job existed. This job runs the scan, so no session has to remember it.
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan reads `origin/main...HEAD`, so the merge base has to be in the clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Read this change set's own added comments
        run: |
          git fetch --quiet origin main
          report=$(ai/kk-flavor/skills/kk-edit/scripts/voice-check.sh origin/main...HEAD 2>&1) || status=$?
          echo "$report"
          case "${status:-0}" in
            0) ;;
            1) echo "::error::The comments this change adds are written in the register the rule forbids. Each finding is an edit." ; exit 1 ;;
            *) echo "::error::The register scan did not run, which is not a pass." ; exit 2 ;;
          esac
          # An empty scan exits 0, which passes: a change set that leaves comments alone gives the scan no input.
          case "$report" in
            *"nothing reached the scan"*) echo "No added comments reached the scan, which passes." ;;
          esac

  # The instruction tree's baseline, which until this job had one reader: a sentence in a skill telling
  # an agent to look at it. A ratchet without a reader is a document.
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Hold every instruction file to its baseline
        run: ai/kk-flavor/skills/kk-ecosystem/scripts/voice-baseline.sh
