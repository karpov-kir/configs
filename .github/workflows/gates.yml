# The gates that run on a push. release-tools.yml also gates the Go tools, but only on a tag, which is
# no gate on the commits between tags.
#
# The Go step duplicates release-tools.yml's `Gate`, and that one must stay: it guards the
# binaries a release attaches, and `resolve.sh` prefers a downloaded binary over the source beside
# it, so a release built from unchecked code is worse than no release. Sharing them would mean a
# reusable workflow, which is more machinery than three commands are worth.
#
# No suite list here: ai/run-tests.sh discovers every `*-test.sh`, so a suite added later is gated
# without anyone remembering to register it, and finding none is a failure rather than an empty pass.
#
# Both legs matter. macOS is where these suites are written and where /bin/bash is 3.2; Linux is where
# they are unproven and where CI is cheap. fail-fast is off so one leg going red still reports the
# other, since the delta between them is the portability signal.
#
# The actions carry a major tag rather than an exact pin: nothing in this repo bumps an exact pin, so
# it would rot and never pick up a patch like checkout v7.0.1's fork-guard fix. Prune this override
# the day dependabot or renovate lands.
#
# Every setup-go step here sets `cache: false`, for one reason: setup-go looks for its cache key file
# in the repo root only — go.mod now, go.sum before v6.3.0 — and this module is in ai/tools. Left
# default it annotates every run with a miss that can never become a hit. cache-dependency-path would
# point it here, but the only thing to cache is a build cache keyed on a go.mod that never changes.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Some suites cover scripts that build or resolve the Go tools. jq and gh, the other two
      # binaries the suites reach for, are preinstalled on both images.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      - name: Run every suite
        run: ai/run-tests.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      # `-count=1` because `go test ./...` reports `ok (cached)` over a package that fails.
      # `-timeout 30m` because the eco-report suite runs past Go's 10m default on a loaded runner, and
      # overrunning it prints a goroutine dump that reads as a hang rather than as a slow pass.
      - name: Gate
        working-directory: ai/tools
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go test -count=1 -timeout 30m ./...

  # Proves the shell suites' cases can actually fail. ai/run-tests.sh cannot cover this — it discovers
  # `*-test.sh` and the harness is not one — so without this job, editing a guard silently retires the
  # proof that its case can redden and nothing says so.
  #
  # No -j: the harness defaults to twice the cores, which adapts to whatever runner it lands on.
  # Linux only, because what is being proved is that a guard reddens, which is not OS-specific.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # What gives a stateless job a running count: each attempt writes its own entry under a key
      # unique to it, and the next run restores the newest entry under the prefix. The count itself,
      # and what it decides, are `ai/nomeasure-count.sh`'s. It lives in $HOME rather than the
      # workspace, having no business in the checkout `shell-mutate.sh` runs the real suites against.
      #
      # `run_attempt` is in the key and not only `run_id`, because a re-run carries the same run_id and
      # `actions/cache/save` will not overwrite a key that already exists. A re-run that finally
      # measured would leave the previous attempt's count in the cache, and the escalation to exit 1
      # would outlive the history that earned it, failing the job over runs that did measure.
      #
      # The ref is in the key so a run can only escalate on its own history. GitHub lets a pull-request
      # restore reach the base branch's caches and the default branch's, so without it a PR would
      # restore main's count and fail over a chain of runs that were never its own. `github.ref_name`
      # is `<number>/merge` on a pull request, so what a PR accumulates is that PR's. The hole left is
      # a ref whose name begins with another's plus a hyphen: with these triggers, a manual dispatch
      # on a branch named `main-…`, which would read main's count.
      #
      # Entries are evicted after 7 days, so the count is recent history rather than the repository's.
      - name: Restore the did-not-measure count
        uses: actions/cache/restore@v4
        with:
          path: ~/mutants-nomeasure
          key: mutants-nomeasure-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutants-nomeasure-${{ github.ref_name }}-

      # Exit 2 is the harness reporting that a loaded machine killed mutants on its watchdog, not that
      # a guard failed to redden; its own header says not to read those as findings. So this warns
      # loudly and passes rather than turning machine load into a code defect — which is how a gate
      # gets `|| true`'d and stops gating. Exit 1, a guard that did not redden, fails.
      #
      # What a status does to the count, what a garbage count means and where the escalation sits are
      # `ai/nomeasure-count.sh`'s, case by case in `nomeasure-count-test.sh`. What stays here is what
      # only CI can do: run the harness, and put the verdict in the annotation and the step summary.
      - name: Prove the guards can fail
        run: |
          set +e
          ai/shell-mutate.sh
          status=$?
          note="$(ai/nomeasure-count.sh "$status" "$HOME/mutants-nomeasure")"
          verdict=$?
          set -e

          if [ "$verdict" -eq 0 ]; then
            exit "$status"
          fi

          # An annotation alone lives inside a log fold, and a job that warns-and-passes on a
          # permanently slow runner would never measure and never say so — a green tick over a
          # thing never reached. The step summary puts it on the run's face instead.
          if [ "$verdict" -eq 1 ]; then
            echo "::warning::$note"
            {
              echo "### :warning: guards unproven on this run"
              echo
              echo "$note"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$verdict" -eq 3 ]; then
            echo "::error::$note"
            {
              echo "### :x: guards unproven, and no longer weather"
              echo
              echo "$note"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Every verdict the script defines is handled above, so this arm is reached only when it did
          # not decide: its own exit 2, or a 126/127 from a file that is missing or not executable.
          # Falling through to the warn arm would pass the job on an empty note, which is the green
          # tick over nothing this counter exists to stop.
          echo "::error::nomeasure-count.sh exited $verdict without deciding, so this run says nothing about the guards and nothing about the count. The reason is in this step's log."
          exit 1

      # `always()`, or a run that escalates to exit 1 never saves the count that escalated and the
      # next run starts from the entry before it — the counter would reset itself exactly when it
      # first mattered.
      - name: Save the did-not-measure count
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/mutants-nomeasure
          key: mutants-nomeasure-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The instruction tree — standards, SKILL.md files, templates. `ai/run-tests.sh` discovers
  # `*-test.sh`, and the wiring check is not a suite, so without this job a citation pointing at a file
  # that does not exist reaches main with nothing looking at it.
  #
  # `check.sh` exits 1 with findings and 2 when it could not run at all, and both fail the job — a
  # check that did not run is not a clean one, which is the rule the script's own header states.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The scans are Go. `check.sh` reaches the binary through `resolve.sh`, which builds from the
      # source beside it when no release binary is present — which is the case on a fresh runner.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      - name: Check the instruction tree wires up
        run: ai/skills/kk-ecosystem/scripts/check.sh
