# release-tools.yml gates the Go tools too, but only on a tag, so the commits between tags would go
# unchecked. Its `Gate` step and the `go` job below are deliberate duplicates; folding them together
# needs a reusable workflow, which is more machinery than three commands justify.
#
# Don't add a suite list. ai/run-tests.sh discovers every `*-test.sh`, so a suite added later is
# gated without anyone registering it, and finding none fails instead of passing empty.
#
# The suites matrix runs both OSes on purpose: these suites are written on macOS against its
# /bin/bash 3.2, and Linux is where they're unproven. fail-fast is off so a red leg still reports the
# other one, since the delta between them is the portability signal.
#
# Actions carry a major tag rather than an exact pin, because nothing here bumps an exact pin and it
# would rot. Drop this override once dependabot or renovate lands.
#
# Every setup-go step sets `cache: false`. setup-go looks for go.mod in the repo root and this module
# lives in ai/tools, so the default annotates every run with a miss that can never hit.
# cache-dependency-path would point it here, but the only thing to cache is a build cache keyed on a
# go.mod that never changes.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Some suites build or resolve the Go tools.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      - name: Run every suite
        run: ai/run-tests.sh

  # `-count=1` because Go's test cache is keyed on the module, and several suites read files outside
  # it: eco-report's fixtures copy in `ai/skills/idsd-qualify`'s report template and todo-gate.sh, and
  # `ai/kk-flavor`'s tree-fingerprint.sh. The cache can't see those, so a plain run answers out of
  # cache over a tree one of them has changed, and this job goes green on exactly that.
  # `.github/workflows/release-tools.yml` cites this comment rather than repeating it.
  #
  # `ai/gate.sh` answers the same hole developer-side, keying on those files itself. Keep this job
  # anyway: the gate is a fast path beside the full sweep, not a replacement for it.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      - name: Gate
        working-directory: ai/tools
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          # `-timeout` and this value must match goSuiteTimeout in ai/tools/gate/run.go, which says why.
          go test -count=1 -timeout 30m ./...

  # Proves the Go suites' cases can actually fail. The `go` job can't: a green suite says its cases
  # passed, never that any of them could have failed. Without this job, editing a guard quietly
  # retires the proof that its case can redden.
  #
  # No -jobs — the harness defaults to twice the cores and adapts to whatever runner it lands on.
  # Linux only, since "a guard reddens" isn't OS-specific.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      # What gives a stateless job a running count: each attempt writes an entry under a key unique to
      # it, and the next run restores the newest entry under the prefix. The count itself, and what it
      # decides, are `ai/tools/nomeasure`'s. It lives in $HOME rather than the workspace, having no
      # business in the checkout the harness runs the real suites against.
      #
      # `run_attempt` is in the key as well as `run_id`, because a re-run carries the same run_id and
      # `actions/cache/save` won't overwrite a key that already exists. A re-run that finally measured
      # would leave the previous attempt's count in the cache, and the escalation to exit 1 would
      # outlive the history that earned it, failing the job over runs that did measure.
      #
      # The ref is in the key so a run can only escalate on its own history. GitHub lets a pull-request
      # restore reach the base branch's caches and the default branch's, so without it a PR would
      # restore main's count and fail over a chain of runs that were never its own. `github.ref_name`
      # is `<number>/merge` on a pull request, so what a PR accumulates is that PR's. One hole remains:
      # a ref whose name begins with another's plus a hyphen. With these triggers that means a manual
      # dispatch on a branch named `main-…`, which would read main's count.
      #
      # Entries are evicted after 7 days, so the count is recent history rather than the repository's.
      - name: Restore the did-not-measure count
        uses: actions/cache/restore@v4
        with:
          path: ~/mutants-nomeasure
          key: mutants-nomeasure-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutants-nomeasure-${{ github.ref_name }}-

      # Two builds rather than `go run`: `go run` maps a build failure onto the same non-zero exit the
      # harness uses for its own verdicts, and the arms below would then read a compiler error as a
      # finding about a guard. Built here, a build failure fails this step before any verdict exists.
      - name: Build the harness and the counter
        working-directory: ai/tools
        run: |
          go build -o go-mutate/go-mutate ./go-mutate/
          go build -o cmd/nomeasure/nomeasure ./cmd/nomeasure/

      # Exit 2 is the harness reporting that a loaded machine killed mutants on its watchdog, not that
      # a guard failed to redden; its own header says not to read those as findings. So this warns
      # loudly and passes rather than turning machine load into a code defect, which is how a gate gets
      # `|| true`'d and stops gating. Exit 1, a guard that did not redden, fails.
      #
      # How a status moves the count, and when the count escalates, are `ai/tools/nomeasure`'s.
      - name: Prove the guards can fail
        working-directory: ai/tools
        run: |
          set +e
          ./go-mutate/go-mutate
          status=$?
          note="$(./cmd/nomeasure/nomeasure "$status" "$HOME/mutants-nomeasure")"
          verdict=$?
          set -e

          if [ "$verdict" -eq 0 ]; then
            exit "$status"
          fi

          # An annotation alone lives inside a log fold, and a job that warns-and-passes on a
          # permanently slow runner would never measure and never say so. The step summary is what
          # keeps that off a green tick.
          if [ "$verdict" -eq 1 ]; then
            echo "::warning::$note"
            {
              echo "### :warning: guards unproven on this run"
              echo
              echo "$note"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$verdict" -eq 3 ]; then
            echo "::error::$note"
            {
              echo "### :x: guards unproven, and no longer just machine load"
              echo
              echo "$note"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Every verdict the counter defines is handled above, so this arm means it did not decide:
          # its own exit 2, or a 126/127 from a binary that is missing or not executable. Falling
          # through to the warn arm would pass the job on an empty note, which is the green tick over
          # nothing this counter exists to stop.
          echo "::error::nomeasure exited $verdict without deciding, so this run says nothing about the guards and nothing about the count. The reason is in this step's log."
          exit 1

      # `always()`, or a run that escalates to exit 1 never saves the count that escalated and the
      # next run starts from the entry before it — the counter would reset itself exactly when it
      # first mattered.
      - name: Save the did-not-measure count
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/mutants-nomeasure
          key: mutants-nomeasure-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The instruction tree — standards, SKILL.md files, templates. `ai/run-tests.sh` discovers
  # `*-test.sh` and the wiring check is not a suite, so without this job a citation pointing at a file
  # that does not exist reaches main with nothing looking at it.
  #
  # `check.sh` exits 1 with findings and 2 when it could not run at all. Both fail the job: a check
  # that did not run is not a clean one, which is the rule the script's own header states.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The scans are Go, and `check.sh` reaches the binary through `resolve.sh`, which builds from the
      # source beside it when no release binary is present — the case on a fresh runner.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      # --gate, so this job and ai/gate.sh's wiring unit ask the same question of the same commit.
      # resolve.sh has written ai/tools/bin/eco-check by the time the walk runs, so without the flag
      # the check reads that build output and cannot judge it.
      - name: Check the instruction tree wires up
        run: ai/skills/kk-ecosystem/scripts/check.sh --gate
