# The gates that run on a push. release-tools.yml also gates the Go tools, but only on a tag, which is
# no gate on the commits between tags.
#
# The Go step duplicates release-tools.yml's `Gate`, and that one must stay: it guards the
# binaries a release attaches, and `resolve.sh` prefers a downloaded binary over the source beside
# it, so a release built from unchecked code is worse than no release. Sharing them would mean a
# reusable workflow, which is more machinery than three commands are worth.
#
# No suite list here: ai/run-tests.sh discovers every `*-test.sh`, so a suite added later is gated
# without anyone remembering to register it, and finding none is a failure rather than an empty pass.
#
# Both legs matter. macOS is where these suites are written and where /bin/bash is 3.2; Linux is where
# they are unproven and where CI is cheap. fail-fast is off so one leg going red still reports the
# other, since the delta between them is the portability signal.
#
# The actions carry a major tag rather than an exact pin: nothing in this repo bumps an exact pin, so
# it would rot and never pick up a patch like checkout v7.0.1's fork-guard fix. Prune this override
# the day dependabot or renovate lands.
#
# Every setup-go step here sets `cache: false`, for one reason: setup-go looks for its cache key file
# in the repo root only — go.mod now, go.sum before v6.3.0 — and this module is in ai/tools. Left
# default it annotates every run with a miss that can never become a hit. cache-dependency-path would
# point it here, but the only thing to cache is a build cache keyed on a go.mod that never changes.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Some suites cover scripts that build or resolve the Go tools. jq and gh, the other two
      # binaries the suites reach for, are preinstalled on both images.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      - name: Run every suite
        run: ai/run-tests.sh

  # `-count=1` because Go's test cache is keyed on the module, and several suites read files outside
  # it: eco-report's fixtures copy in `ai/skills/idsd-qualify`'s report template and todo-gate.sh, and
  # `ai/kk-flavor`'s tree-fingerprint.sh. The cache cannot see those files, so a plain run answers out
  # of cache over a tree one of them has changed, and this job would go green on exactly that.
  # Measured: truncate that report template to one line and `go test -count=1 ./eco-report/` fails,
  # while `go test ./eco-report/` says `ok (cached)` over the same corrupt tree.
  #
  # A cached failure is not the hole. A deliberately failing case appended to eco-root re-ran and
  # re-failed on two consecutive runs, never once from cache. `.github/workflows/release-tools.yml`
  # cites this paragraph rather than repeating it.
  #
  # `ai/gate.sh` is the developer-side answer to the same hole — it keys on those files itself and
  # forces the packages that read them. This job stays as it is: the gate is a fast path beside the
  # full sweep, never a substitute for it.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      - name: Gate
        working-directory: ai/tools
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          # -timeout, and this value, for the reason ai/tools/gate/run.go states at goSuiteTimeout.
          # The two have to match.
          go test -count=1 -timeout 30m ./...

  # Proves the guards can actually fail. `ai/run-tests.sh` cannot cover this — it discovers `*-test.sh`
  # and the mutation harnesses are not suites — so without this job, editing a guard retires the proof
  # that its case can redden and nothing says so.
  #
  # Linux only, because what is being proved is that a guard reddens, which is not OS-specific.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      # exit 1 is a guard that did not redden, and it fails the job. exit 2 is the gate saying it cannot
      # report, and only one thing reaching that is weather: a mutation suite the runner killed before
      # it measured. Passing on any of the rest is a green tick over a run that never happened, the
      # failure this job was fixed for, silent instead of red. The no-input case even outranks a failure
      # inside the gate, so a guard that did not redden beside one comes out as 2.
      #
      # The grep below names the weather case by the line the gate prints for it and for nothing else.
      # The rest are an open set, so a reason added later fails this job until someone decides it is
      # weather. TestTheMutantsJobNamesTheGatesDidNotMeasureLine holds the pattern to the gate's wording.
      #
      # The warning also goes to the step summary, because an annotation alone lives inside a log fold.
      # Nothing here catches a runner that never measures at all: no count crosses runs, so such a job
      # warns every time and never escalates.
      #
      # No `timeout-minutes`, and that is a gap rather than a decision. This runs every mutation unit
      # cold on each push with no cache between runs, and twelve units alone took the better part of an
      # hour on a developer machine, so a smaller runner could plausibly want hours. A bound guessed
      # under the real figure cancels a legitimate sweep and reddens every push — the failure this job
      # was just fixed for, arriving from the other side. GitHub's six-hour default is the only bound
      # until the duration is read off a real run; set one from that number rather than from this note.
      - name: Prove the guards can fail
        run: |
          log="$RUNNER_TEMP/mutants.log"
          set +e
          ai/gate.sh --mutants >"$log" 2>&1
          status=$?
          set -e
          cat "$log"

          if [ "$status" -ne 2 ]; then
            exit "$status"
          fi

          if ! grep -q 'unit(s) exited 2 without measuring' "$log"; then
            echo "::error::ai/gate.sh --mutants exited 2 for a reason other than a unit that ran without measuring, so this is not machine load and nothing here says the guards were proven. The reason is in this step's log."
            exit 1
          fi

          note="ai/gate.sh --mutants exited 2: the gate ran and measured nothing, so this run says nothing about the guards it names. The reason is in this step's log."
          echo "::warning::$note"
          {
            echo "### :warning: guards unproven on this run"
            echo
            echo "$note"
          } >> "$GITHUB_STEP_SUMMARY"

  # The instruction tree — standards, SKILL.md files, templates. `ai/run-tests.sh` discovers
  # `*-test.sh`, and the wiring check is not a suite, so without this job a citation pointing at a file
  # that does not exist reaches main with nothing looking at it.
  #
  # `check.sh` exits 1 with findings and 2 when it could not run at all, and both fail the job:
  # a check that did not run is not a clean one, which is the rule the script's own header states.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The scans are Go. `check.sh` reaches the binary through `resolve.sh`, which builds from the
      # source beside it when no release binary is present — which is the case on a fresh runner.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ai/tools/go.mod
          cache: false

      # --gate, so this job and ai/gate.sh's wiring unit ask the same question of the same commit.
      # Not a no-op on a fresh runner: resolve.sh builds from source when no release binary is present,
      # writes ai/tools/bin/eco-check, and only then execs it — so build output exists in the tree by
      # the time the walk runs, and without the flag the check reads files it cannot judge.
      - name: Check the instruction tree wires up
        run: ai/skills/kk-ecosystem/scripts/check.sh --gate
