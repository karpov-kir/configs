# How long one roll of the judge's model gets before it is cut off. One `roll-timeout <seconds>`
# line. `${XDG_CONFIG_HOME:-~/.config}/kk-flavor/reader-judge.conf` overrides it on one machine.
#
# Generous on purpose. An honest roll that gets clipped costs the whole gate at exit 2, so the bound
# sits well past what a roll takes. `ai/tools/reader-judge/deadline.go` holds the measurements and the
# ratio behind it.
roll-timeout 900
