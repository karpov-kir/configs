# How long one roll of the judge's model gets before it is cut off. A vote rolls every roll at once,
# so a run is bounded at one of these whatever its roll count.
#
# `${XDG_CONFIG_HOME:-~/.config}/kk-flavor/reader-judge.conf` overrides this on one machine and
# announces itself on stderr; this default is silent. Either file, present but unusable, refuses.
# One `roll-timeout <seconds>` line.
#
# Generous on purpose: clipping an honest roll costs the whole gate at exit 2, so this sits far above
# what a roll takes. `ai/tools/reader-judge/deadline.go` holds the measurements and the ratio they set
# it at.
roll-timeout 900
