# Where idsd records live, for a repository that does not track its own .idsd/.
# `${XDG_CONFIG_HOME:-~/.config}/kk-flavor/idsd.conf` overrides this on one machine and announces
# itself on stderr. This default is silent. Either file, present but unusable, refuses.
# One `root <path>` line. A leading `~/` expands.
root ~/Documents/idsd
