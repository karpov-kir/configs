# Thresholds for the comment-density detector, which flags changed source files whose added lines are
# comment-heavy. One run overrides any of these with the environment variable paired below; there is
# no machine-local `.conf` for them, so this file is where the default lives.
#
#   max-ratio       COMMENT_MAX_RATIO       flag above this comments/(comments+code) share of added lines
#   min-lines       COMMENT_MIN_LINES       ignore a file with fewer added comment lines than this
#   max-file-bytes  DENSITY_MAX_FILE_BYTES  skip a file larger than this unread
max-ratio 0.3
min-lines 5
max-file-bytes 262144
