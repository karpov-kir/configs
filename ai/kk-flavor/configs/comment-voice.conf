# The words this codebase coined, and the findings it has decided to keep. Each line is
# `coined <word>`, `domain <word>` or `allow <check> <matched text> # <reason>`, and a line with no
# reason is refused.

# voice-check adds this file to `${XDG_CONFIG_HOME:-~/.config}/kk-flavor/comment-voice.conf`, where
# another codebase on this machine keeps its words. COMMENT_VOICE_CONF names one file to read in place
# of both. No repository's own copy is read, since a tree under review could use one to keep its own
# findings.

# The six below name real things a reader can type: four scripts, the flag every installer takes, and
# one of git's own.
# Go forbids a hyphen in an identifier, so the packages spell mcpsync, projectmcp, readerjudge and voicecheck. The
# field spells isDryRun, a bool on the run struct. The check reads the hyphenated name beside one of
# those as an invented compound. Without these lines, a usage line cannot name the script it documents.
domain mcp-sync
domain project-mcp
domain reader-judge
domain voice-check
domain dry-run
# git's own flag, `git rev-parse --git-path`. A case asserting which directory a worktree answers has
# to name the flag that answered.
domain git-path
