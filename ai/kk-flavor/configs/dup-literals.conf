# Thresholds for the repeated-long-literal detector. It reports byte-identical long strings that
# appear twice or more among a diff's added lines. An environment variable overrides each key for one
# run, and the list pairs them. No machine-local `.conf` exists for these, so the default lives here.
#
#   min-length      DUP_MIN_LEN         minimum literal length in characters
#   max-file-bytes  DUP_MAX_FILE_BYTES  skip an untracked file larger than this
min-length 100
max-file-bytes 262144
