# Thresholds for the repeated-long-literal detector, which reports byte-identical long strings
# appearing twice or more among a diff's added lines. One run overrides either of these with the
# environment variable paired below; there is no machine-local `.conf` for them, so this file is where
# the default lives.
#
#   min-length      DUP_MIN_LEN         minimum literal length in characters
#   max-file-bytes  DUP_MAX_FILE_BYTES  skip an untracked file larger than this
min-length 100
max-file-bytes 262144
