# The service's own dev dependencies. `start:dev` brings them up, reads each random host port with
# `docker compose port` and stops them on exit.
name: <app>

services:
  database:
    image: postgres:<version>
    environment:
      POSTGRES_USER: <app>
      POSTGRES_DB: <app>
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets:
      - database-password
    ports:
      - "127.0.0.1::5432"
    volumes:
      - database-data:/var/lib/postgresql
    # `up --wait` returns once this passes, so db:migrate finds Postgres ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <app> -d <app>"]
      interval: 2s
      retries: 15

secrets:
  database-password:
    file: ../env/database-password.development

volumes:
  database-data:
