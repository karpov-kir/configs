# The service's own dev stack: its Postgres and the Traefik in front of it. `start:dev` brings it up and stops it.
# Every service takes 127.0.0.1:5432 and :443, so run one service locally at a time.
name: <app>

services:
  database:
    image: postgres:<version>
    environment:
      POSTGRES_USER: <app>
      POSTGRES_DB: <app>
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets:
      - database-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database-data:/var/lib/postgresql
    # `up --wait` returns once this passes, so db:migrate finds Postgres ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <app> -d <app>"]
      interval: 2s
      retries: 15

  # It routes api.<app>.dev to the service on the host, as traefik-routes.yml says.
  traefik:
    image: traefik:<version>
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/traefik-routes.yml
    ports:
      - "443:443"
    volumes:
      - ./traefik-routes.yml:/etc/traefik/traefik-routes.yml:ro
      - ./dev-certs:/etc/traefik/certs:ro
    extra_hosts:
      - host.docker.internal:host-gateway

secrets:
  database-password:
    file: ../env/database-password.development

volumes:
  database-data:
