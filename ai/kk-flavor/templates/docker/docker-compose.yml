# The service's own dev dependencies. `start:dev` brings them up and stops them on exit. Every task that
# reaches one reads its random host port with `docker compose port`.
name: <app>

services:
  database:
    image: postgres:<version>
    environment:
      POSTGRES_USER: <app>
      POSTGRES_DB: <app>
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets:
      - database-password
    ports:
      - "127.0.0.1::5432"
    volumes:
      # postgres:17 keeps its data here. From 18 on, mount /var/lib/postgresql instead.
      - database-data:/var/lib/postgresql/data
    # `up --wait` returns once this passes, so db:migrate finds Postgres ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <app> -d <app>"]
      interval: 2s
      retries: 15

secrets:
  database-password:
    file: ../env/database-password.development

volumes:
  database-data:
