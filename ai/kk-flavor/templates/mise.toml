[tools]
go = "<major>"
node = "<major>"

[vars]
# Asks in a macOS dialog (osascript) with hidden input and prints the answer. The text says which password
# and what happens once it is given. It goes in as an osascript argument, so no text can break the quoting.
# Cancel exits non-zero.
ask = """ask() { osascript -e 'on run argv' -e 'text returned of (display dialog (item 1 of argv) default answer "" with hidden answer with title (item 2 of argv))' -e 'end run' "$1" "<app>"; }"""
# Postgres takes a random host port, so several services run at once. Every task that reaches it reads the
# port here.
read_database_port = """addr=$(docker compose -f docker/docker-compose.yml port database 5432) || exit; export DATABASE_HOST=${addr%:*} DATABASE_PORT=${addr##*:}"""

# The server sits at the repo root here, beside web/. Where it lives in backend/, give its tasks dir = "backend"
# (env:crypt dir = "backend/env") and the backend: prefix, start:dev included.

[tasks.setup]
run = ["go mod download", "npm --prefix web ci"]

[tasks.check]
depends = ["lint", "build", "test"]

[tasks."check:ci"]
depends = ["lint", "build", "test:ci"]

[tasks.lint]
depends = ["backend:lint:gofmt", "backend:lint:govet", "web:lint"]

[tasks.build]
depends = ["backend:build", "web:build"]

[tasks.test]
depends = ["backend:test", "web:test"]

[tasks."test:ci"]
depends = ["backend:test:ci", "web:test:ci"]

# Name every dir holding Go code: gofmt walks what it is given, and `.` takes in web/node_modules.
[tasks."backend:lint:gofmt"]
run = 'test -z "$(gofmt -l <go dirs> | tee /dev/stderr)"'

[tasks."backend:lint:govet"]
run = "go vet ./..."

[tasks."backend:build"]
run = "go build ./..."

[tasks."backend:test"]
run = "go test ./..."

# go test refuses a coverprofile in a missing dir. The last line fails the run below 80% total coverage.
[tasks."backend:test:ci"]
run = [
  "mkdir -p coverage",
  "go test -coverpkg=./... -coverprofile=coverage/coverage.out ./...",
  "go tool cover -func=coverage/coverage.out | awk '/^total:/ { t = $3 + 0; print } END { exit (t < 80) }'",
]

# web/package.json holds the scripts: lint runs every linter, tsc included, and test:ci is `vitest run --coverage`.
[tasks."web:lint"]
dir = "web"
run = "npm run lint"

[tasks."web:build"]
dir = "web"
run = "npm run build"

[tasks."web:test"]
dir = "web"
run = "npm test"

[tasks."web:test:ci"]
dir = "web"
run = "npm run test:ci"

# Each prints only X.Y.Z on one line, the number CI tags a release with. Drop web:version where web/ ships
# inside the server's image: web/package.json then holds no version.
[tasks."backend:version"]
run = "cat VERSION"

[tasks."web:version"]
dir = "web"
run = "node -p \"require('./package.json').version\""

[tasks."start:dev"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
compose=(docker compose -f docker/docker-compose.yml)
trap '"${compose[@]}" stop' EXIT
# bash leaves SIGTERM (an IDE's stop button, kill) at its default, which skips the EXIT trap.
trap 'exit 143' TERM
"${compose[@]}" up -d --wait
{{vars.read_database_port}}
mise run db:migrate
<watch> # e.g. tsx watch src/entrypoints/server/start.ts | air | go run . | …
'''
# A CLI tool only some tasks call sits on those tasks: in [tools], mise installs it before every task.
tools = { "<go:module/of/the/watcher>" = "<major>" }

[tasks."db:migrate"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{vars.read_database_port}}
<the project's forward-only migrate command>
'''

# sops encrypts env files for the age public keys in .sops.yaml, and each person decrypts with their own key. The
# script is the one shared copy, fetched by a full commit SHA of karpov-kir/configs, never a branch or tag: a SHA
# cannot move under the project. Raise <configs commit SHA> to take a change; never copy its body here. mise
# fetches it only when an env task runs or is listed.
[tasks."env:crypt"]
description = "Encrypt, decrypt or re-key one env file: mise run env:crypt <encrypt|decrypt|rekey> <env>"
hide = true
dir = "env"
file = "https://raw.githubusercontent.com/karpov-kir/configs/<configs commit SHA>/ai/kk-flavor/templates/mise-tasks/env-crypt"
tools = { sops = "3" }

# One task per environment that has an encrypted file. rekey re-encrypts for the keys now in .sops.yaml, after someone
# joins or leaves.
[tasks."env:encrypt:development"]
run = "mise run env:crypt encrypt development"

[tasks."env:decrypt:development"]
run = "mise run env:crypt decrypt development"

[tasks."env:rekey:development"]
run = "mise run env:crypt rekey development"

[tasks."env:encrypt:staging"]
run = "mise run env:crypt encrypt staging"

[tasks."env:decrypt:staging"]
run = "mise run env:crypt decrypt staging"

[tasks."env:rekey:staging"]
run = "mise run env:crypt rekey staging"

[tasks."env:encrypt:production"]
run = "mise run env:crypt encrypt production"

[tasks."env:decrypt:production"]
run = "mise run env:crypt decrypt production"

[tasks."env:rekey:production"]
run = "mise run env:crypt rekey production"

# <platform> is the servers' platform, e.g. linux/amd64.
[tasks."docker:build"]
run = "docker build --platform <platform> -f docker/Dockerfile -t <app>:local ."
