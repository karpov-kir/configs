# The scan runs at the repo root after `mise run check:ci`, which writes the reports named below.
# Every path here is from the repo root.
sonar.projectKey=<repo>

sonar.sources=<go dirs>,web/src
sonar.tests=<go dirs>,web/src
# A file indexed as both a source and a test fails the scan, so test files leave the sources.
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

sonar.go.coverage.reportPaths=coverage/coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.testExecutionReportPaths=web/coverage/test-report.xml
