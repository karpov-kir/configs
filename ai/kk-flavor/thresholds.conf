# What a score has to beat to stay. Ruled by standards/writing.md → **Score what survives**; read by
# scripts/score.sh, which is the only thing that should read it — a number copied out of here into
# prose is a second home for it.
#
# One line per lane: <lane> cut <= <n>. A thing scoring at or below n goes; n+1 and above stays.
# The ladder is standards/ecosystem.md → **Earn the place** made countable: the bar rises with how
# often the reader pays for the text, so a line every session loads has to clear more than a message
# read once and closed.
#
# A lane names the text, never the stage reading it. The same file takes the same lane whichever pass
# scores it, and where two fit — an always-loaded file is an instruction as well — the higher governs,
# because the reader pays the higher cost either way.
#
# One machine may move a bar without moving this file, from
# `${XDG_CONFIG_HOME:-~/.config}/kk-flavor/thresholds.conf` — untracked, overlaid per lane and
# announced whenever it takes effect. It can only move a lane this file already rules: naming a lane
# that is not here exits rather than adding one, so the set of lanes lives here and nowhere else.

# `default` is the lane a caller names when no other fits, never one an unknown lane lands on. A
# caller that cannot find its number invents one, and an invented threshold reads exactly like a
# ruled one, so score.sh exits on an unknown lane rather than falling back here.
default        cut <= 5
reply          cut <= 5
outward-text   cut <= 5
report         cut <= 5
instruction    cut <= 6
always-loaded  cut <= 7
