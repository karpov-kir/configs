# The words this repository coined and the findings it has decided to keep. Read before the machine's
# own copy, because a coined word belongs to the codebase rather than to whoever is typing. Its shape
# is `coined <word>`, `domain <word>` or `allow <check> <matched text> # <reason>`, and an entry
# without a reason is refused.
#
# These three are the names of real files a reader can type: ai/mcp-sync.sh, ai/project-mcp.sh, and
# the --dry-run flag every installer takes. Each reads as an invented compound only because Go forbids
# a hyphen in the identifier beside it, so the package spells mcpsync, projectmcp and isDryRun. Without
# these entries a usage line cannot name the script it documents.
domain mcp-sync
domain project-mcp
domain dry-run
