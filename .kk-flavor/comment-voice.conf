# The words this repository coined and the findings it has decided to keep. Read before the machine's
# own copy, because a coined word belongs to the codebase rather than to whoever is typing. Its shape
# is `coined <word>`, `domain <word>` or `allow <check> <matched text> # <reason>`, and an entry
# without a reason is refused.
#
# These four are the names of real things a reader can type: three scripts, and the flag every
# installer takes. Each reads as an invented compound only because Go forbids a hyphen in the
# identifier beside it, so the packages spell mcpsync, projectmcp and readerjudge, and the field
# spells isDryRun. Without these entries a usage line cannot name the script it documents.
domain mcp-sync
domain project-mcp
domain reader-judge
domain dry-run
