# The words this repository coined, and the findings it has decided to keep. This file is read before
# the machine's own copy. A coined word belongs to the codebase, not to whoever is typing. Each line is
# `coined <word>`, `domain <word>` or `allow <check> <matched text> # <reason>`, and a line with no
# reason is refused.
#
# The four below name real things a reader can type: three scripts, and the flag every installer takes.
# Go forbids a hyphen in an identifier, so the packages spell mcpsync, projectmcp and readerjudge, and
# the field spells isDryRun. The check reads the hyphenated name beside one of those as an invented
# compound. Without these lines, a usage line cannot name the script it documents.
domain mcp-sync
domain project-mcp
domain reader-judge
domain dry-run
