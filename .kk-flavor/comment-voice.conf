# The words this repository coined and the findings it has decided to keep. Read before the machine's
# own copy, because a coined word belongs to the codebase rather than to whoever is typing. Its shape
# is `coined <word>`, `domain <word>` or `allow <check> <matched text> # <reason>`, and an entry
# without a reason is refused.

allow coined-identifier mcp-sync # The usage line names ai/mcp-sync.sh, a real script a reader can type. The finding fires only because Go forbids a hyphen in the package name beside it, so the alias is mcpsync and the two read as one invented compound. Every other command in ai/tools/cmd/ spells its own script the same way; this one is caught because the file is new on this branch and the scan reads added lines alone.
allow coined-identifier project-mcp # The same, for ai/project-mcp.sh beside the projectmcp alias.
